name: Bug report
description: Something on the board looks wrong or does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Card version
      placeholder: "1.3.1"
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Android tablet, Fully Kiosk / Chrome on Windows"
  - type: dropdown
    id: style
    attributes:
      label: Board style
      options: [Classic, Split-flap, Digital flaps, Amsterdam, London, LED, All of them]
  - type: textarea
    id: config
    attributes:
      label: Card config (YAML)
      render: yaml
